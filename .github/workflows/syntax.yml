          include/gear/Race/RaceDirectorVt6.hpp
          include/gear/Race/RaceDirectorVt7.hpp
          include/gear/Race/RaceDirectorVt8.hpp
          include/gear/Race/RaceDirectorVt9.hpp
          include/gear/Race/RaceKartCheckerBattle.hpp
